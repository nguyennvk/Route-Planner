spring.application.name=route-planner-api

server.port=8088

# Values come from environment variables; the part after ":" is the default
# used when running locally against the Docker database (port 5433).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/route_planner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway creates/changes tables; Hibernate only checks they match the entities
spring.jpa.hibernate.ddl-auto=validate

# When Hibernate loads a lazy relation (e.g. each order's customer), load it for up to 50 rows
# in one query instead of one query per row (the "N+1" problem)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Reads JWT_SECRET etc. from the project's .env file when running locally
spring.config.import=optional:file:.env[.properties]

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=route-planner-api
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d

app.geocodio.api-key=${GEOCODIO_API_KEY}

# Distance Matrix (OSRM)
routing.osrm.base_url=https://router.project-osrm.org
routing.osrm.max_table_size=100
routing.osrm.requests_per_second=1
