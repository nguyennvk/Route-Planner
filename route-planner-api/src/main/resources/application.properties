spring.application.name=route-planner-api

server.port=8088

# Values come from environment variables; the part after ":" is the default
# used when running locally against the Docker database (port 5433).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/route_planner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway creates/changes tables; Hibernate only checks they match the entities
spring.jpa.hibernate.ddl-auto=validate

# When Hibernate loads a lazy relation (e.g. each order's customer), load it for up to 50 rows
# in one query instead of one query per row (the "N+1" problem)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Reads JWT_SECRET etc. from the project's .env file when running locally
spring.config.import=optional:file:.env[.properties]

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=route-planner-api
app.jwt.access-token-ttl=30m
app.jwt.refresh-token-ttl=30d

app.geocodio.api-key=${GEOCODIO_API_KEY}

# Distance Matrix (OSRM)
routing.osrm.base_url=${OSRM_BASE_URL}
routing.osrm.max_table_size=100
routing.osrm.requests_per_second=1

# Timefold solver setting
timefold.solver.termination.spent-limit=30s
timefold.solver.termination.unimproved-spent-limit=5s
timefold.solver-manager.parallel-solver-count=1

# Frontend
frontend.base_url=${FRONTEND_URL:http://localhost:4200}
frontend.allowed_origins=${FRONTEND_ORIGINS:http://localhost:4200,https://localhost:4200,http://192.168.*:4200,https://192.168.*:4200}

# Feedback form: where it's emailed. Set these in .env; with FEEDBACK_TO or the SMTP login empty,
# feedback is only saved in the feedback table. For Gmail use an app password, not the account password
feedback.mail.to=${FEEDBACK_TO:}
feedback.mail.from=${FEEDBACK_FROM:}
feedback.mail.host=${FEEDBACK_SMTP_HOST:smtp.gmail.com}
feedback.mail.port=${FEEDBACK_SMTP_PORT:587}
feedback.mail.username=${FEEDBACK_SMTP_USERNAME:}
feedback.mail.password=${FEEDBACK_SMTP_PASSWORD:}

# Redis connection
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=200ms
